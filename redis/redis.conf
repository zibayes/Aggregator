# Включение персистентности через AOF (самый надёжный вариант)
appendonly yes
appendfsync everysec

# Альтернативно можно использовать RDB-снэпшоты (но AOF предпочтительнее)
# save 900 1
# save 300 10
# save 60 10000

# Отключаем защищённый режим для работы внутри Docker
protected-mode no

# Явно указываем порт
port 6379

# Логирование (опционально)
loglevel notice
logfile ""